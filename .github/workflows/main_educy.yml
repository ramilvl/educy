name: Deploy Next.js to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: educy
  NODE_VERSION: "24.x"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prepare standalone
        run: |
          cp -r .next/static .next/standalone/.next/
          if [ -d public ]; then cp -r public .next/standalone/; fi

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: .next/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5660B11796004B2E929F496FE0742549 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_842341CB337B4B709C98624753F8FA79 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EF801704DB744BDAA62D8C938149AD35 }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: educy
          package: .